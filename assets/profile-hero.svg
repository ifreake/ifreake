<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ifreake — Software meets hardware</title>
  <desc id="desc">A dark graphite profile banner with red circuit-inspired details.</desc>
  <defs>
