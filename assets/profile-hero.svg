  <text x="90" y="164" fill="#f0f3f6" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Hey, I'm <tspan fill="#ff626b">ifreake</tspan>.</text>
  <text x="94" y="204" fill="#b8c1cc" font-family="Segoe UI, Arial, sans-serif" font-size="21">Building practical things with code, circuits, and curiosity.</text>
